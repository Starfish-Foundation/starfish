name: CI

on:
  push:
    branches: [main, bfish-rust]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo check -p bfish-core -p bfish-mcp -p bfish-backend
      - run: cargo test -p bfish-core -p bfish-mcp -p bfish-backend
      - run: cargo clippy -p bfish-core -p bfish-mcp -p bfish-backend -- -D warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            website/package-lock.json
      - run: node plugin/build.mjs
      - run: npm --prefix app ci
      - run: npm --prefix app run build
      - run: npm --prefix website ci
      - run: npm --prefix website run build
