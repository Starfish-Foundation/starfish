[workspace]
resolver = "2"
members = [
    "crates/bfish-core",
    "crates/bfish-mcp",
    "crates/bfish-backend",
    "crates/bfish-app",
]
default-members = [
    "crates/bfish-core",
    "crates/bfish-mcp",
    "crates/bfish-backend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bfish-tools/bfish"
authors = ["BFish contributors"]

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
